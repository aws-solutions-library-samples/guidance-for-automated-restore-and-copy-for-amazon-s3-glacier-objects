  EventDynamoDBTable:
    Condition: CopyMechanism
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::DynamoDB::Table'
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TimeToLiveSpecification:
          AttributeName: service_ddb_item_expiration
          Enabled: true
      AttributeDefinitions:
        - AttributeName: obj_url_hash
          AttributeType: S
        - AttributeName: bucket_name
          AttributeType: S
      KeySchema:
        - AttributeName: obj_url_hash
          KeyType: HASH
        - AttributeName: bucket_name
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST    

