  AWS::CloudFormation::Interface:
    ParameterGroups:

      -
        Label:
          default: "Archived Bucket and Object Details"
        Parameters:
          - ArchiveBucket
          - ExistingArchiveStorageClass

      -
        Label:
          default: "Automated Restore and Manifest Generator Section"
        Parameters:
          - ArchiveBucketPrefix
          - ArchiveBucketObjectSuffix
          - ArchiveBucketObjectCreatedAfter          
          - ArchiveBucketObjectCreatedBefore
          - ArchiveBucketObjectSizeGreaterThan
          - ArchiveBucketObjectSizeLessThan
          - StartRestoreJob        

      -
        Label:
          default: "Destination Bucket and Prefix Parameters"
        Parameters:
          - DestinationBucket
          - BucketForCopyDestinationPrefix

      -
        Label:
          default: "Archive Restore Parameters"
        Parameters:
          - ArchiveObjectRestoreDays
          - ArchiveRestoreTier

      -
        Label:
          default: "Please choose the mechanism for copying the restored archives"
        Parameters:
          - CopyMethod          

      -
        Label:
          default: "Archive Copy Parameters"
        Parameters:
          - CopyMetadata
          - CopyTagging
          - StorageClass
          
      -
        Label:
          default: "Job Notification and Tracking"
        Parameters:
          - RecipientEmail
                       
      -
        Label:
          default: "AWS SDK Performance, Function, and other Parameters for Archive Copying"
        Parameters:
          - SDKThroughput
          - MultipartThreshold
          - MultipartChunkSize  
          - CopyFunctionReservedConcurrency 


    ParameterLabels:
      DestinationBucket:
        default: "Destination Bucket"
      BucketForCopyDestinationPrefix:
        default: "Destination Bucket Prefix"
      ArchiveBucketPrefix:
        default: Archived Object Prefix  
      ArchiveBucketObjectSuffix:
        default: Archived Object Suffix
      ArchiveBucketObjectCreatedAfter:
        default: Include objects created AFTER this date          
      ArchiveBucketObjectCreatedBefore:
        default: Include objects created BEFORE this date
      ArchiveBucketObjectSizeGreaterThan:
        default: Include objects larger than this size (bytes)
      ArchiveBucketObjectSizeLessThan:
        default: Include objects smaller than this size (bytes)        


Parameters:

  BucketForCopyDestinationPrefix:
    Description: Please specify the Destination Bucket Prefix or Path without the starting or trailing "/", Leave Blank to Retain Original Path
    Type: String
    MinLength: '0'
    MaxLength: '1024'
 

  ArchiveObjectRestoreDays:
    Description: Please how long the Amazon S3 retains the temporary copy of your restored archived object
    Type: Number
    MinValue: 1
    MaxValue: 10
    ConstraintDescription: Please choose the number of days you want to retain the restored temporary copy. Allowed values are between 1 and 10. 
    Default: '2'

  ArchiveRestoreTier:
    Description: Please enter the speed at which your archived object is restored. Choose Standard for faster restore 
    Type: String
    ConstraintDescription: Please Choose Valid Restore Tier Values Only
    Default: BULK
    AllowedValues:
      - STANDARD
      - BULK

  ArchiveBucket:
    Description: Please enter the name of the bucket containing the Archived Objects
    Type: String
    AllowedPattern: '^[a-z0-9.-]{3,63}$'
    ConstraintDescription: Bucket name must contain only lowercase letters, numbers, periods (.), and dashes (-). Visit Amazon S3 User Guide 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html' 


  ArchiveBucketPrefix:
    Description: Please specify the Prefix you want to restore in your Archive Bucket, add a trailing "/" for objects under the Prefix. Leave blank to restore the whole bucket
    Type: String
    MinLength: '0'
    MaxLength: '1024'

  ArchiveBucketObjectSuffix:
    Description: Please object suffix you want to restore in your Archive Bucket, for example .csv. Leave blank to restore any object
    Type: String
    MinLength: '0'
    MaxLength: '1024'   
    AllowedPattern: '^$|\.[a-zA-Z0-9]+$'
    ConstraintDescription: Please specify a valid suffix, for example '.csv'


  ArchiveBucketObjectCreatedBefore:
    Description: Please specify a date to include objects created BEFORE this date, use the format YYYY-MM-DD. Leave blank to restore any object age
    Type: String
    AllowedPattern: '^$|^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
    ConstraintDescription: Please specify a valid datetime format, for example 2024-12-25


  ArchiveBucketObjectCreatedAfter:
    Description: Please specify a date to include objects created AFTER this date, use the format YYYY-MM-DD. Leave blank to restore any object age
    Type: String
    AllowedPattern: '^$|^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
    ConstraintDescription: Please specify a valid datetime format, for example 2024-12-25

  ArchiveBucketObjectSizeGreaterThan:
    Description: Include objects Larger than the specified size. Zero [0] bytes is predefined, you can accept the predefined value or modify if required. 
    Type: Number
    Default: 0
    MinValue: 0

  ArchiveBucketObjectSizeLessThan:
    Description: Include objects Smaller than the specified size. 3 Terabytes (1024^4) is predefined, you can accept the predefined value or modify if required.
    Type: Number
    Default: 3298534883328
    MinValue: 2
    MaxValue: 5497558138880    
 


  DestinationBucket:
    Description: Please enter the name of the bucket where the archived objects will be copied to
    Type: String
    MinLength: '3'
    MaxLength: '63'

  SDKThroughput:
    Description: The maximum number of concurrent requests and connection pool the SDK uses for multipart transfers
    Type: Number
    MinValue: 10
    MaxValue: 940    
    Default: 200
    ConstraintDescription: Value must be a Valid Integer and within the range of 10 to 940

  MultipartThreshold:
    Description: Multipart Threshold size in bytes (MB*1024*1024) when the SDK switches to multipart transfers.
    Type: Number
    Default: 5368709120
    MinValue: 8388608
    MaxValue: 5368709120
    AllowedValues:
      - 8388608
      - 16777216
      - 104857600      
      - 5368709120 
    ConstraintDescription: Multipart Threshold size Value must be a Valid Integer!


  MultipartChunkSize:
    Description: Multipart Chunk in bytes (MB*1024*1024), when SDK switches to Multipart transfers
    Type: Number
    Default: 16777216
    MinValue: 5242880
    MaxValue: 5368709120
    AllowedValues:
      - 8388608
      - 16777216       
    ConstraintDescription: Multipart Chunk Value must be a Valid Integer!
     

  CopyMetadata:
    AllowedValues:
      - Enable  # Copies metadata. This predefined configuration is a Requirement!
    Description: Enables copying source object metadata to destination and Source Storage Class Check
    Type: String
    Default: Enable

  CopyTagging:
    AllowedValues:
      - Enable  # Copies Tags
      - Disable  # Do not copy Tags
    Description: Please Choose to enable or disable copying source object tags to destination
    Type: String

  StorageClass:
    AllowedValues:
      - STANDARD
      - STANDARD_IA
      - ONEZONE_IA
      - INTELLIGENT_TIERING
      - GLACIER_IR
      - GLACIER
      - DEEP_ARCHIVE
    Description: Please Choose your desired S3 Storage-Class for the Object Copy to the destination Amazon S3 bucket
    Default: STANDARD
    Type: String

  CopyMethod:
    AllowedValues:
      - Copy with Batch Operations and Lambda after delay period
      - Copy immediately restore is completed with S3 Event notifications
    Description: Please choose how you want to start the copy workflow. You can start the copy after a delay period with Batch Operations or immediately as soon as restore is completed with Eventbridge notifications
    Type: String
    Default: Copy with Batch Operations and Lambda after delay period    


  StartRestoreJob:
    AllowedValues:
      - Manually with Own CSV Manifest
      - Automatically with Manifest Generator
    Description: Please choose how you want to start the restore and copy workflow. You can manually upload your CSV manifest or automatically start the restore job
    Type: String
    Default: Manually with Own CSV Manifest


  ExistingArchiveStorageClass:
    AllowedValues:
      - GLACIER
      - DEEP_ARCHIVE
      - GLACIER_AND_DEEP_ARCHIVE
    Description: Please choose the existing storage class of your Archive
    Type: String


  RecipientEmail:
    Description: Please enter the Email address to receive Job notifications. Please remember to Confirm the Subscription
    Type: String
    MinLength: '5'
    MaxLength: '150'


  CopyFunctionReservedConcurrency:
    Description: Choose Unreserved to allow S3 Batch utilize up to 1,000 concurrency, or optionally specify the reserved concurrency for the Lambda function S3 Batch Operations Invokes to perform Copy operations. Note, setting a value impacts the concurrency pool available to other functions. 
    Type: String
    Default: Unreserved
    ConstraintDescription: Value must be within the range of 0 to 200
    AllowedValues:
      - Unreserved
      - 200
      - 150
      - 100
      - 50
      - 10
   


Conditions:
    NoFunctionConcurrency: !Equals [!Ref CopyFunctionReservedConcurrency, Unreserved]       
    WorkflowStart: !Equals 
      - !Ref StartRestoreJob 
      - Automatically with Manifest Generator
    CopyMechanism: !Equals 
      - !Ref CopyMethod 
      - Copy immediately restore is completed with S3 Event notifications                 



Mappings:
  SQS:
    Queue:
      visibilitytimeout: 900
      messageretentionperiod: 604800
      maxrecievecount: 10
    Eventmapping:
      maxattempts: 50
      batchsize: 1    
      dlqbatchsize: 20
      concurrency: 1000
      batchingwindow: 1
      

  Parameters:
    Values:
      inventorysch: Weekly
      gfrstddelay: 5
      gfrbulkdelay: 12
      gdastddelay: 12
      gdabulkdelay: 50
    Jobs:
      JobSchedulerScheduleCronExpressions: rate(30 minutes)
    SDK:
      SDKMaxErrorRetries: 100    
      SDKInvokeStateMachineMaxRetry: 10
  ManifestBucketinfo:
    manifest:
      csvnoversionid: restore-and-copy/csv-manifest/no-version-id/
      csvwithversionid: restore-and-copy/csv-manifest/with-version-id/
    batchopsreport:
      restorejob: batch-ops-report/restore
      copyjob: batch-ops-report/copy
      redrivecopy: batch-ops-report/redrivecopy
    batchopsjob:
      manifest: batch-ops/manifest  
    s3events:
      eventoneid: 'job-report-for-restore'
      eventoneprefixvalue: 'batch-ops-report/restore/'
      eventonesuffixvalue: '.json'
      eventtwoid: 'initiate-restore-worker'
      eventtwoprefixvalue: 'restore-and-copy/csv-manifest/'
      eventtwosuffixvalue: '.csv'
      eventthreeid: 'job-report-for-copy'
      eventthreeprefixvalue: 'batch-ops-report/copy/'
      eventthreesuffixvalue: '.json'
      eventfourid: 'redrive-failed-copy'
      eventfourprefixvalue: 'redrive-failed-copy/'
      eventfoursuffixvalue: '.csv'
      bucketpatha: 'batch-ops-report/copy/'
      bucketpathb: 'batch-ops-report/restore/'
      bucketpathc: 'restore-and-copy/csv-manifest/no-version-id/'
      bucketpathd: 'restore-and-copy/csv-manifest/with-version-id/'
      bucketpathe: 'redrive-failed-copy/csv-manifest/with-version-id/'
      bucketpathf: 'redrive-failed-copy/csv-manifest/no-version-id/'
      bucketpathg: 'redrive-failed-copy/eventbridge/with-version-id/'
      bucketpathh: 'redrive-failed-copy/eventbridge/no-version-id/'      



Resources:

  S3AutoRestoreCopyTopic:
    DependsOn:
      - CheckBucketExists   
    Type: AWS::SNS::Topic
    Properties: 
      KmsMasterKeyId: alias/aws/sns    


  S3AutoRestoreCopyTopicSubscription:
    DependsOn:
      - CheckBucketExists   
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref RecipientEmail
      Protocol: email
      TopicArn: !Ref S3AutoRestoreCopyTopic

  S3AutoRestoreCopyDynamoDBTable:
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::DynamoDB::Table'
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PROVISIONED  
      TimeToLiveSpecification:
          AttributeName: item_expiration
          Enabled: true
      AttributeDefinitions:
        - AttributeName: restore_job_id
          AttributeType: S
        - AttributeName: restore_job_status
          AttributeType: S
      KeySchema:
        - AttributeName: restore_job_id
          KeyType: HASH
        - AttributeName: restore_job_status
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 3


  S3AutoRestoreCopyJobSchedulerEventRule:
    DependsOn:
      - CheckBucketExists   
    Type: AWS::Events::Rule
    Properties:
      Description: "ScheduledRule"
      ScheduleExpression: !FindInMap [ Parameters, Jobs, JobSchedulerScheduleCronExpressions ]
      State: 
        !If [CopyMechanism, "DISABLED", "ENABLED" ]
      Targets:
        -
          Arn: !GetAtt
            - S3AutoRestoreCopyJobSchedulerWorker
            - Arn
          Id: "S3AutoRestoreCopyJobSchedulerWorker"





############################# Lambda Invocation Permissions ############################################

  S3AutoRestoreCopyEventsPermissionToInvokeLambda:
    DependsOn:
      - CheckBucketExists   
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3AutoRestoreCopyJobSchedulerWorker
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt
        - S3AutoRestoreCopyJobSchedulerEventRule
        - Arn

  LambdaInvokePermission:
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::Lambda::Permission'
    Properties:
      FunctionName: !GetAtt S3AutoRestoreCopyRestoreWorker.Arn
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}'


  LambdaInvokePermission2:
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::Lambda::Permission'
    Properties:
      FunctionName: !GetAtt S3AutoRestoreCopyJobTrackerWorker.Arn
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}'


  LambdaInvokePermission3:
    Type: 'AWS::Lambda::Permission'
    DependsOn:
      - CheckBucketExists 
    Properties:
      FunctionName: !GetAtt RedriveCopyWorker.Arn
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}'

############################# Lambda Invocation Permissions End ############################################

################################## Custom Resources ##############################################################

################################ CheckBucketExists ######################################################


  CheckBucketExists:
    Type: 'Custom::LambdaTrigger'
    Properties:
      ServiceToken: !GetAtt CheckBucketExistsLambdaFunction.Arn
      bucketexists: !Ref ArchiveBucket


  CheckBucketExistsIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:  
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow       
        - PolicyName: Permissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetBucketLocation'
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArchiveBucket}


  CheckBucketExistsLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64
      Handler: index.lambda_handler
      Role: !GetAtt CheckBucketExistsIAMRole.Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
            import json
            import cfnresponse
            import logging
            import os
            import boto3
            from botocore.exceptions import ClientError
            from botocore.client import Config

            # Enable debugging for troubleshooting
            # boto3.set_stream_logger("")


            # Set up logging
            logger = logging.getLogger(__name__)
            logger.setLevel('INFO')


            # Define Environmental Variables
            my_region = str(os.environ['AWS_REGION'])


            # Set SDK paramters
            config = Config(retries = {'max_attempts': 5})

            # Set variables
            # Set Service Parameters
            s3Client = boto3.client('s3', config=config, region_name=my_region)


            def check_bucket_exists(bucket):
                logger.info(f"Checking if Archive Bucket Exists")
                try:
                    check_bucket = s3Client.get_bucket_location(
                        Bucket=bucket,
                    )
                except ClientError as e:
                    logger.error(e)
                    raise
                else:
                    logger.info(f"Bucket {bucket}, exists, proceeding with deployment ...")
                    return check_bucket            


            def lambda_handler(event, context):
              # Define Environmental Variables
              s3Bucket  = event.get('ResourceProperties').get('bucketexists')

              logger.info(f'Event detail is: {event}')

              if event.get('RequestType') == 'Create':
                # logger.info(event)
                try:
                  logger.info("Stack event is Create, checking specified Bucket has Object Lock Enabled...")
                  check_bucket_exists(s3Bucket)
                  responseData = {}
                  responseData['message'] = "Successful"
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                except Exception as e:
                  logger.error(e)
                  responseData = {}
                  responseData['message'] = str(e)
                  failure_reason = str(e) 
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData, reason=failure_reason)


              elif event.get('RequestType') == 'Delete' or event.get('RequestType') == 'Update':
                logger.info(event)
                try:
                  logger.info(f"Stack event is Delete or Update, nothing to do....")
                  responseData = {}
                  responseData['message'] = "Completed"
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                except Exception as e:
                  logger.error(e)
                  responseData = {}
                  responseData['message'] = str(e)
                  logger.info(f"Sending Invocation Response {responseData['message']} to Cloudformation Service")
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData)                  


################################################ Code Ends ####################################################

################################ StackNametoLower #######################################################


  StackNametoLower:
    Type: Custom::NametoLower
    Properties:
      ServiceToken: !GetAtt NametoLower.Arn
      stackname: !Ref AWS::StackName    


  NametoLowerIAMRole:
    DependsOn:
      - CheckBucketExists  
    Type: AWS::IAM::Role
    Properties:
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow       
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"


  NametoLower:
    DependsOn:
      - CheckBucketExists     
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64
      Description: Enforces Lower case for Stackname
      MemorySize: 128
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt NametoLowerIAMRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import cfnresponse


          def lambda_handler(event, context):
              to_lower = event['ResourceProperties'].get('stackname', '').lower()
              responseData = dict(change_to_lower=to_lower)
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)

################################# Code Ends ############################################################


###################### Start Function Invocations of Custom Resources #############################


  InvokeCustomBackedLambda:
    DependsOn:
      - CheckBucketExists    
    Type: Custom::InvokeCustomLambda
    Properties:
      ServiceToken: !GetAtt CreateBucketEventNotification.Arn
      my_solution_bucket: !Ref S3AutoRestoreCopyS3Bucket
      bucket_event_destination_lambda: !GetAtt S3AutoRestoreCopyJobTrackerWorker.Arn
      bucket_event_destination_lambda_1: !GetAtt S3AutoRestoreCopyRestoreWorker.Arn
      bucket_event_destination_redrivecopy: !GetAtt RedriveCopyWorker.Arn


  

#################### Custom Resource Invocation End ########################







  S3AutoRestoreCopyS3Bucket:
    DependsOn:
      - CheckBucketExists    
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpirationRule
            Status: Enabled
            ExpirationInDays: 180
            NoncurrentVersionExpiration:
                NoncurrentDays: 3
          - Id: delete-incomplete-mpu
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1       


  S3BatchOperationsServiceIamRole:
    DependsOn:
      - CheckBucketExists 
    Type: 'AWS::IAM::Role'
    Properties:
      Policies:
        - PolicyName: S3BatchOperationsServiceIamRolePolicy0
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:GetBucketLocation'
                  - 's3:PutObject'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}
                  - !Sub arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}/*
                Effect: Allow
              - Action:
                  - 'lambda:InvokeFunction'
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${S3BatchCopyLambdafunction}*'
                Effect: Allow
              - Action:
                  - 's3:RestoreObject'
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArchiveBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${ArchiveBucket}/*
                Effect: Allow
              - Action:
                  - 's3:GetBucketLocation'
                  - 's3:PutInventoryConfiguration'                  
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArchiveBucket}
                Effect: Allow                    
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: batchoperations.s3.amazonaws.com
            Action: 'sts:AssumeRole'

########################## S3 Restore Worker Function ####################################

  S3AutoRestoreCopyRestoreWorkerIAMRole:
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::IAM::Role'
    Properties:
      Policies:
        - PolicyName: AWSLambdaBasicExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'                  
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
                Effect: Allow      
        - PolicyName: GrantFunctioAdditionalPerm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - 's3:ListBucket'
                  - 's3:GetObject'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}
                  - !Sub arn:${AWS::Partition}:s3:::${S3AutoRestoreCopyS3Bucket}/*
                Effect: Allow
              - Action:
                  - 's3:DescribeJob'
                  - 's3:ListJobs'
                  - 's3:PutJobTagging'
                  - 's3:CreateJob'
                Resource: !Sub 'arn:${AWS::Partition}:s3:${AWS::Region}:${AWS::AccountId}:job/*'
                Effect: Allow
              - Action:
                  - 'iam:PassRole'
                Resource: !GetAtt S3BatchOperationsServiceIamRole.Arn
                Effect: Allow
              - Action:
                  - 'sns:Publish'
                Resource: !Ref S3AutoRestoreCopyTopic
                Effect: Allow
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'



  S3AutoRestoreCopyRestoreWorker:
    DependsOn:
      - CheckBucketExists   
    Type: 'AWS::Lambda::Function'
    Properties:
      Architectures:
        - arm64
      Environment:
        Variables:
          archive_restore_days: !Ref ArchiveObjectRestoreDays
          archive_restore_tier: !Ref ArchiveRestoreTier
          s3_bucket: !Sub ${ArchiveBucket}
          batch_ops_report_bucket: !Ref S3AutoRestoreCopyS3Bucket
          batch_ops_role: !GetAtt S3BatchOperationsServiceIamRole.Arn
          my_current_region: !Sub ${AWS::Region}
          my_account_id: !Sub ${AWS::AccountId}
          my_sns_topic_arn: !Ref S3AutoRestoreCopyTopic
          batch_ops_restore_report_prefix: !FindInMap
              - ManifestBucketinfo
              - batchopsreport
              - restorejob
      Handler: index.lambda_handler
      Role: !GetAtt S3AutoRestoreCopyRestoreWorkerIAMRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          from urllib import parse
          import boto3
          import botocore
          import os
          import json
          import logging
          from botocore.exceptions import ClientError

          # Set up logging
          logger = logging.getLogger(__name__)
          logger.setLevel('INFO')

          # Enable Verbose logging for Troubleshooting
          # boto3.set_stream_logger("")

          # Define Lambda Environmental Variable
          my_role_arn = str(os.environ['batch_ops_role'])
          report_bucket_name = str(os.environ['batch_ops_report_bucket'])
          # Archive Restoration Details ###############################################
          restore_expiration = int(os.environ['archive_restore_days'])
          restore_tier = str(os.environ['archive_restore_tier'])
          accountId = str(os.environ['my_account_id'])
          my_region = str(os.environ['my_current_region'])
          my_sns_topic_arn = str(os.environ['my_sns_topic_arn'])
          my_s3_bucket = str(os.environ['s3_bucket'])


          # Specify variables #############################

          # Job Manifest Details ################################
          job_manifest_format = 'S3BatchOperations_CSV_20180820'  # S3InventoryReport_CSV_20161130


          # Job Report Details ############################
          report_prefix = str(os.environ['batch_ops_restore_report_prefix'])
          report_format = 'Report_CSV_20180820'
          report_scope = 'AllTasks'

          # Construct ARNs ############################################
          report_bucket_arn = 'arn:aws:s3:::' + report_bucket_name

          # Initiate Service Clients ###################
          s3Client = boto3.client('s3', region_name=my_region)
          s3ControlClient = boto3.client('s3control', region_name=my_region)
          sns = boto3.client('sns', region_name=my_region)

          # SNS Message Function
          def send_sns_message(sns_topic_arn, sns_message):
              logger.info("Sending SNS Notification Message......")
              sns_subject = 'Notification from AutoRestoreCopy Solution'
              try:
                  response = sns.publish(TopicArn=sns_topic_arn, Message=sns_message, Subject=sns_subject)
              except ClientError as e:
                  logger.error(e)

          # Retrive Manifest ETag
          def get_manifest_etag(manifest_s3_bucket, manifest_s3_key):
              # Get manifest key ETag ####################################
              try:
                  manifest_key_object_etag = s3Client.head_object(Bucket=manifest_s3_bucket, Key=manifest_s3_key)['ETag']
              except ClientError as e:
                  logger.error(e)
              else:
                  logger.info(manifest_key_object_etag)
                  return manifest_key_object_etag


          # S3 Batch Restore Job Function

          def s3_batch_ops_restore(manifest_bucket, manifest_key):
              logger.info("Calling the Amazon S3 Batch Operation Restore API")

              # Construct ARNs ############################################
              manifest_bucket_arn = 'arn:aws:s3:::' + manifest_bucket
              manifest_key_arn = 'arn:aws:s3:::' + manifest_bucket + '/' + manifest_key
              # Get manifest key ETag ####################################
              manifest_key_object_etag = get_manifest_etag(manifest_bucket, manifest_key)

              # Set Description #
              my_job_description = f"Restore Job by AutoRestoreCopy Solution for S3Bucket: {my_s3_bucket}"                

              # Set Manifest format and Specify Manifest Fields #
              manifest_format = None
              manifest_fields = None
              manifest_fields_count = None
              if "restore-and-copy/csv-manifest/with-version-id/" in manifest_key:
                  logger.info("Set Format to CSV and Use Version ID in manifest")
                  manifest_format = 'S3BatchOperations_CSV_20180820'
                  manifest_fields = ['Bucket', 'Key', 'VersionId']
                  manifest_fields_count = str(len(manifest_fields))
              elif "restore-and-copy/csv-manifest/no-version-id/" in manifest_key:
                  logger.info("Set Format to CSV and Don't use Version ID in Manifest")
                  manifest_format = 'S3BatchOperations_CSV_20180820'
                  manifest_fields = ['Bucket', 'Key']
                  manifest_fields_count = str(len(manifest_fields))

              my_bops_restore_kwargs = {

                  'AccountId': accountId,
                  'ConfirmationRequired': False,
                  'Operation': {
                      'S3InitiateRestoreObject': {
                          'ExpirationInDays': restore_expiration,
                          'GlacierJobTier': restore_tier
                      }
                  },
                  'Report': {
                      'Bucket': report_bucket_arn,
                      'Format': report_format,
                      'Enabled': True,
                      'Prefix': report_prefix,
                      'ReportScope': report_scope
                  },
                  'Manifest': {
                      'Spec': {
                          'Format': manifest_format,
                          'Fields': manifest_fields
                      },
                      'Location': {
                          'ObjectArn': manifest_key_arn,
                          'ETag': manifest_key_object_etag
                      }
                  },
                  'Priority': 10,
                  'RoleArn': my_role_arn,
                  'Description' : my_job_description,
                  'Tags': [
                      {
                          'Key': 'auto-restore-copy',
                          'Value': manifest_fields_count
                      },
                  ]
              }

              try:
                  response = s3ControlClient.create_job(**my_bops_restore_kwargs)
                  logger.info(f"JobID is: {response['JobId']}")
                  logger.info(f"S3 RequestID is: {response['ResponseMetadata']['RequestId']}")
                  logger.info(f"S3 Extended RequestID is:{response['ResponseMetadata']['HostId']}")
                  return response['JobId']
              except ClientError as e:
                  logger.error(e)


          def lambda_handler(event, context):
              logger.info(event)
              s3Bucket = str(event['Records'][0]['s3']['bucket']['name'])
              logger.info(s3Bucket)
              s3Key = parse.unquote_plus(event['Records'][0]['s3']['object']['key'], encoding='utf-8')
              logger.info(s3Key)
              job_id = s3_batch_ops_restore(s3Bucket, s3Key)
              my_sns_message = f'Restore Job {job_id} Successfully Submitted to Amazon S3 Batch Operation'
              send_sns_message(my_sns_topic_arn, my_sns_message)




