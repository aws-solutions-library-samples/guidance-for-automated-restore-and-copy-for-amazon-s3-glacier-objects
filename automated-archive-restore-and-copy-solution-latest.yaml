        deadLetterTargetArn: !GetAtt MyDLQ.Arn
        maxReceiveCount: !FindInMap [SQS, Queue, maxrecievecount ]

  MyDLQ:   
    Condition: CopyMechanism
    DependsOn:
      - CheckBucketExists       
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: 
      VisibilityTimeout: !FindInMap [SQS, Queue, visibilitytimeout ]
      MessageRetentionPeriod: !FindInMap [SQS, Queue, messageretentionperiod ]


  MySQSPolicy:
    Condition: CopyMechanism
    DependsOn:
      - CheckBucketExists     
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Id: MyQueuePolicy
        Version: '2012-10-17'
        Statement:
        - Sid: Allow-Event-SendMessage
          Effect: Allow
          Principal:
            Service:
              - events.amazonaws.com
          Action:
          - sqs:SendMessage
          Resource: !GetAtt MySQSQueue.Arn  
          Condition:
            ArnEquals:
              "aws:SourceArn" : !GetAtt EventRule0.Arn

        - Sid: Enforce Secure Transport
          Effect: Deny
          Principal: '*'
          Action:
          - sqs:SendMessage
          - sqs:ReceiveMessage
          Resource: !GetAtt MySQSQueue.Arn  
          Condition:
            Bool:
              "aws:SecureTransport" : "false"                       
      Queues:
      - !Ref MySQSQueue   

  MySQSPolicyDLQ:
    Condition: CopyMechanism
    DependsOn:
      - CheckBucketExists     
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Id: MyQueuePolicy
        Version: '2012-10-17'
        Statement:
        - Sid: Enforce Secure Transport
          Effect: Deny
          Principal: '*'
          Action:
          - sqs:SendMessage
          - sqs:ReceiveMessage
          Resource: !GetAtt MyDLQ.Arn  
          Condition:
            Bool:
              "aws:SecureTransport" : "false"            
      Queues:
      - !Ref MyDLQ                                     
            

